services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VPS_IP=${VPS_IP}
    volumes:
      - ./docker/prod/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/prod/letsencrypt:/etc/letsencrypt:ro
      - app_storage:/var/www/html/storage:ro
      - app_bootstrap:/var/www/html/bootstrap/cache:ro
    depends_on:
      - frontend
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
    environment:
      - VPS_IP=${VPS_IP}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/prod/letsencrypt:/etc/letsencrypt
      - ./docker/prod/certbot-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --preferred-profile shortlived; sleep 43200 & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_bootstrap:
