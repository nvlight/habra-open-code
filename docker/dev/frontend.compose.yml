services:
  frontend-dev:
    image: node:22.22-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "9000:9000"
    networks:
      - sail
      - default
    environment:
      API_PROXY_TARGET: http://laravel.test
      CI: "1"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    stdin_open: true
    tty: true

  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    volumes:
      - ../../frontend:/app
    networks:
      - sail
      - default
    environment:
      E2E_BASE_URL: http://frontend-dev:9000
      CI: "1"
    command: sleep infinity
    profiles: ["e2e"]

networks:
  default:
  sail:
    external: true
    name: habra-open-code_sail
